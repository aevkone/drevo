# Ежедневная пересборка сайта: index.html собирается из data/*.json
# (tools/build.py). Если страница изменилась — коммит в main, GitHub Pages
# публикует его сам. Также запускается при изменении данных и вручную.
name: rebuild

on:
  schedule:
    - cron: '17 1 * * *'   # каждый день в 04:17 по Москве
  push:
    branches: [main]
    paths: ['data/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать index.html из данных
        run: python tools/build.py
      - name: Сохранить изменения
        run: |
          if git diff --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Автосборка сайта из data/"
          git push
